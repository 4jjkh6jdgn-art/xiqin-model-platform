server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xiqin-model-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/xiqin}
    username: ${SPRING_DATASOURCE_USERNAME:xiqin}
    password: ${SPRING_DATASOURCE_PASSWORD:xiqin_dev_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 旧部署已经人工执行到 V4；首次接入 Flyway 时从 V4 建立基线，随后执行 V5。
    # 全新空库不会建立基线，仍会从 V1 完整初始化。
    baseline-on-migrate: true
    baseline-version: 4

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:xiqin_redis_2024}
    timeout: 3000ms

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:xiqin}
    password: ${SPRING_RABBITMQ_PASSWORD:xiqin_mq_2024}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

# ===================== App Config =====================
app:
  jwt:
    secret: ${JWT_SECRET:xiqin_jwt_secret_key_2024_secure}
    expiration: 86400000  # 24h
    header: Authorization
    prefix: "Bearer "

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:xiqin}
    secret-key: ${MINIO_SECRET_KEY:xiqin_minio_2024}
    bucket-models: models
    bucket-thumbnails: thumbnails
    bucket-avatars: avatars

  rabbitmq:
    exchange: xiqin.exchange
    queue-model-process: xiqin.model.process
    queue-file-process: xiqin.file.process
    routing-model-process: xiqin.model.process.key
    routing-file-process: xiqin.file.process.key

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8088,http://localhost:8088}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS

  init:
    admin-username: ${INITIAL_ADMIN_USERNAME:admin}
    admin-password: ${INITIAL_ADMIN_PASSWORD:admin@xiqin2024}
    admin-email: ${INITIAL_ADMIN_EMAIL:admin@xiqin.local}

  # OnlyOffice 在线编辑
  office:
    # 后端基址（OnlyOffice 容器回调/拉取文件可达，需为容器网络内地址）
    base-url: ${OFFICE_BASE_URL:http://backend:8080}
    # OnlyOffice Document Server 对外地址（前端加载 JS API 用）
    server-url: ${OFFICE_SERVER_URL:http://127.0.0.1:8089}
    # 必须与 Document Server 使用同一个随机密钥
    jwt-secret: ${OFFICE_JWT_SECRET:change-me-to-a-32-byte-onlyoffice-secret}

logging:
  level:
    com.xiqin: INFO
    org.hibernate.SQL: WARN
