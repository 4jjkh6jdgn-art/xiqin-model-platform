# Render 平台一键部署配置
# 文档：https://render.com/docs/blueprint-spec
#
# 部署前需要准备的免费外部服务（在 DEPLOY_RENDER.md 中有详细步骤）：
#   1. Upstash Redis（免费）- 提供 SPRING_REDIS_* 变量
#   2. CloudAMQP RabbitMQ（免费）- 提供 SPRING_RABBITMQ_* 变量
#   3. Backblaze B2（免费10GB，S3兼容）- 提供 MINIO_* 变量
#
# 部署步骤：
#   1. Fork 本仓库到你的 GitHub
#   2. 在 Render  Dashboard → New → Blueprint 连接本仓库
#   3. 填写下方带 "需要填写" 标记的环境变量
#   4. 点击 Apply，等待自动部署

services:
  # ========== 前端静态站点（免费） ==========
  - type: web
    name: xiqin-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # 构建时注入后端地址，前端代码会自动转换为 https://host/api
      - key: VITE_API_BASE_URL
        fromService:
          name: xiqin-backend
          type: web
          property: host

  # ========== 后端 Web 服务（免费，15分钟无请求休眠） ==========
  - type: web
    name: xiqin-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/actuator/health
    autoDeploy: true
    envVars:
      # ---- 数据库（自动关联 Render PostgreSQL） ----
      - key: DB_HOST
        fromDatabase:
          name: xiqin-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: xiqin-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: xiqin-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: xiqin-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: xiqin-postgres
          property: password

      # ---- Redis（需要填写，注册 Upstash 免费版获取） ----
      - key: SPRING_REDIS_HOST
        value: YOUR_REDIS_HOST  # 需要填写，例如：redis-12345.upstash.io
      - key: SPRING_REDIS_PORT
        value: "YOUR_REDIS_PORT"  # 需要填写，例如：6379
      - key: SPRING_REDIS_PASSWORD
        value: YOUR_REDIS_PASSWORD  # 需要填写

      # ---- RabbitMQ（需要填写，注册 CloudAMQP 免费版获取） ----
      - key: SPRING_RABBITMQ_HOST
        value: YOUR_RABBITMQ_HOST  # 需要填写，例如：shrimp.rmq.cloudamqp.com
      - key: SPRING_RABBITMQ_PORT
        value: "YOUR_RABBITMQ_PORT"  # 需要填写，例如：5672
      - key: SPRING_RABBITMQ_USERNAME
        value: YOUR_RABBITMQ_USERNAME  # 需要填写
      - key: SPRING_RABBITMQ_PASSWORD
        value: YOUR_RABBITMQ_PASSWORD  # 需要填写

      # ---- 对象存储（需要填写，注册 Backblaze B2 免费版获取，S3兼容） ----
      - key: MINIO_ENDPOINT
        value: YOUR_S3_ENDPOINT  # 需要填写，例如：https://s3.us-east-005.backblazeb2.com
      - key: MINIO_ACCESS_KEY
        value: YOUR_S3_ACCESS_KEY  # 需要填写（keyID）
      - key: MINIO_SECRET_KEY
        value: YOUR_S3_SECRET_KEY  # 需要填写（applicationKey）

      # ---- 安全与跨域 ----
      - key: JWT_SECRET
        generateValue: true  # 自动生成随机密钥
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: xiqin-frontend
          type: web
          property: url
      - key: INITIAL_ADMIN_PASSWORD
        value: admin@xiqin2024  # 初始管理员密码，部署后请修改

      # ---- 运行模式 ----
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # ========== 模型转换 Worker（需付费计划，免费版可先不部署） ==========
  # 取消下面注释即可启用（需要 Render 付费计划）
  # - type: worker
  #   name: xiqin-worker
  #   runtime: docker
  #   dockerfilePath: ./worker/Dockerfile
  #   dockerContext: ./worker
  #   envVars:
  #     - key: RABBITMQ_URL
  #       value: YOUR_RABBITMQ_AMQP_URL  # 需要填写
  #     - key: MINIO_ENDPOINT
  #       value: YOUR_S3_ENDPOINT
  #     - key: MINIO_ACCESS_KEY
  #       value: YOUR_S3_ACCESS_KEY
  #     - key: MINIO_SECRET_KEY
  #       value: YOUR_S3_SECRET_KEY

# ========== PostgreSQL 数据库（免费90天） ==========
databases:
  - name: xiqin-postgres
    databaseName: xiqin
    user: xiqin
    plan: free
    postgresMajorVersion: "16"
    ipAllowList:
      - source: 0.0.0.0/0
        description: 允许所有IP（Render服务访问需要）
