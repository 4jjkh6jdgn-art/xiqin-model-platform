name: ${COMPOSE_PROJECT_NAME:-xiqin}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-xiqin}
      POSTGRES_USER: ${POSTGRES_USER:-xiqin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env.production 中设置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-xiqin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env.production 中设置 RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [internal]
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xiqin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env.production 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    logging: *default-logging

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xiqin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env.production 中设置 MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb local/models --ignore-existing
        mc mb local/thumbnails --ignore-existing
        mc mb local/avatars --ignore-existing
    networks: [internal]
    logging: *default-logging

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请在环境文件中设置 ONLYOFFICE_JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_HEADER: AuthorizationJwt
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${ONLYOFFICE_PORT:-8089}:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice/documentserver/App_Data/cache/files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/info/info.json >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    shm_size: 1gb
    stop_grace_period: 60s
    networks: [internal]
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-xiqin}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-xiqin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env.production 中设置 REDIS_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env.production 中设置 REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-xiqin}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env.production 中设置 RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-xiqin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env.production 中设置 MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.production 中设置 JWT_SECRET}
      OFFICE_BASE_URL: http://backend:8080
      OFFICE_SERVER_URL: ${OFFICE_PUBLIC_URL:-http://127.0.0.1:8089}
      OFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?请在环境文件中设置 ONLYOFFICE_JWT_SECRET}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?请在 .env.production 中设置 INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?请在 .env.production 中设置 INITIAL_ADMIN_EMAIL}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 5GB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 5GB
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [internal]
    logging: *default-logging

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-xiqin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?请在 .env.production 中设置 RABBITMQ_PASSWORD}
      MODEL_PROCESS_QUEUE: xiqin.model.process
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-xiqin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env.production 中设置 MINIO_ROOT_PASSWORD}
      BACKEND_URL: http://backend:8080
      NO_PROXY: backend,minio,rabbitmq,postgres,redis,localhost,127.0.0.1
    volumes:
      - worker_tmp:/tmp/worker
    shm_size: 1gb
    stop_grace_period: 30s
    networks: [internal]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *default-logging

networks:
  internal:
    name: xiqin_internal
    driver: bridge

volumes:
  postgres_data:
    name: xiqin_postgres_data
  redis_data:
    name: xiqin_redis_data
  rabbitmq_data:
    name: xiqin_rabbitmq_data
  minio_data:
    name: xiqin_minio_data
  worker_tmp:
    name: xiqin_worker_tmp
  onlyoffice_data:
    name: xiqin_onlyoffice_data
  onlyoffice_logs:
    name: xiqin_onlyoffice_logs
  onlyoffice_cache:
    name: xiqin_onlyoffice_cache
